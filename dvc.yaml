stages:
  prepare:
    cmd: python scripts/prepare_data.py prepare
    deps:
      - scripts/prepare_data.py
      - data/raw
    params:
      - data.seed
      - data.validation_per_class
    outs:
      - data/prepared
  train:
    cmd: python scripts/model.py train
    deps:
      - scripts/model.py
      - scripts/prepare_data.py
      - scripts/augment_data.py
      - data/${train.dataset}
    params:
      - train
      - logreg
      - random_forest
      - mlp
    outs:
      - models/current
  evaluate:
    cmd: python scripts/model.py evaluate
    deps:
      - scripts/model.py
      - scripts/prepare_data.py
      - scripts/augment_data.py
      - models/current
      - data/prepared/validation.npz
      - data/prepared/summary.json
    metrics:
      - metrics/validation.json:
          cache: true
    outs:
      - reports/validation_details.json
      - reports/validation_predictions.npz
  augment:
    cmd: python scripts/augment_data.py prepare
    deps:
      - scripts/augment_data.py
      - scripts/prepare_data.py
      - data/prepared
    params:
      - augmentation
    outs:
      - data/augmented
  freeze:
    cmd: python scripts/finalize.py freeze
    deps:
      - scripts/finalize.py
      - scripts/model.py
      - scripts/prepare_data.py
      - scripts/augment_data.py
      - models/current
      - metrics/validation.json
      - results/validation_comparison.json
      - data/prepared/summary.json
    outs:
      - models/selected
  test:
    cmd: python scripts/finalize.py test
    deps:
      - scripts/finalize.py
      - scripts/model.py
      - scripts/prepare_data.py
      - scripts/augment_data.py
      - models/selected
      - data/prepared/test.npz
      - data/prepared/summary.json
    metrics:
      - metrics/test.json:
          cache: true
    outs:
      - reports/test_details.json
      - reports/test_predictions.npz
      - results/final_test.json:
          cache: false
  plots:
    cmd: python scripts/finalize.py plots
    deps:
      - scripts/finalize.py
      - results/validation_comparison.json
      - reports/test_details.json
    outs:
      - results/figures:
          cache: false
