data:
  seed: 42
  validation_per_class: 1000
train:
  model: logreg
  seed: 42
  limit_per_class: 0
logreg:
  C: 1.0
  max_iter: 2000
  tol: 0.0001
random_forest:
  n_estimators: 100
  max_depth:
  min_samples_leaf: 1
mlp:
  hidden_layer_sizes:
  - 128
  max_iter: 100
  batch_size: 256
  learning_rate_init: 0.001
  alpha: 0.0001
  tol: 0.0001
augmentation:
  seed: 42
  copies_per_image: 1
  rotation_degrees: 10.0
  max_shift_pixels: 2
  horizontal_flip_probability: 0.5
